    <meta name="theme-color" content="#100E0C" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)" />

    <!--
      Resolve the stored theme before first paint so the page never flashes the
      wrong palette. Key must match THEME_STORAGE_KEY in src/hooks/useTheme.ts.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('geom-odometer-theme')
          document.documentElement.setAttribute(
            'data-theme',
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          )
        } catch (e) {
          /* localStorage unavailable — the dark default in the markup stands */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
